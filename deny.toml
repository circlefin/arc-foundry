# This section is considered when running `cargo deny check advisories`
# More documentation for the advisories section can be found here:
# https://embarkstudios.github.io/cargo-deny/checks/advisories/cfg.html
[advisories]
version = 2
yanked = "warn"
ignore = [
    # https://rustsec.org/advisories/RUSTSEC-2024-0436 paste! is unmaintained
    "RUSTSEC-2024-0436",
    # https://rustsec.org/advisories/RUSTSEC-2025-0141 bincode is unmaintained
    "RUSTSEC-2025-0141",
    # https://rustsec.org/advisories/RUSTSEC-2026-0173 proc-macro-error2 is unmaintained
    # (build-time proc-macro only; pulled in via alloy-sol-macro and reth).
    "RUSTSEC-2026-0173",
    # https://rustsec.org/advisories/RUSTSEC-2026-0194 quick-xml duplicate
    # attribute checking is quadratic.
    "RUSTSEC-2026-0194",
    # https://rustsec.org/advisories/RUSTSEC-2026-0195 quick-xml namespace
    # declaration handling can allocate without a bound. No fixed quick-junit,
    # inferno, or soldeer release is available for either advisory yet.
    "RUSTSEC-2026-0195",
    # https://rustsec.org/advisories/RUSTSEC-2025-0172 zip-extract is unmaintained.
    # It reaches us only through the soldeer-core 0.10.1 we pin; soldeer-core 0.12.1
    # (2026-10-19) drops zip-extract, so bumping soldeer removes this (tracked with
    # the zip advisories below). The advisory lists no patched zip-extract version.
    "RUSTSEC-2025-0172",
    # https://rustsec.org/advisories/RUSTSEC-2026-0118 hickory-proto NSEC3 loop and
    # https://rustsec.org/advisories/RUSTSEC-2026-0119 hickory-proto O(n^2) name
    # compression. Both reach us only through reth-dns-discovery; reth v2.2.0
    # pins hickory ^0.25 so the fix (0.26.1) is unreachable without bumping
    # reth, and foundry runs no p2p DNS node.
    "RUSTSEC-2026-0118",
    "RUSTSEC-2026-0119",
    # --- 2026-10 advisory DB refresh. The semver-reachable advisories from this
    # batch were resolved in Cargo.lock (rustls-webpki, tokio, webpki-roots,
    # webpki-root-certs, zstd-sys, pulldown-cmark); ctutils was fixed through the
    # vendor/ctutils-compat shim; and svm-rs plus the compression-codecs /
    # async-compression stack were bumped so the only remaining users of the
    # vulnerable zip 4 / zstd 0.13 are the ones noted below. The entries that
    # remain cannot move without an upstream release. ---
    # https://rustsec.org/advisories/RUSTSEC-2026-0387 crypto-bigint timing
    # variability. Reaches us only via elliptic-curve 0.13 (alloy-signer, k256,
    # p256); the fix (crypto-bigint 0.7) needs elliptic-curve 0.14, which the alloy
    # signing stack has not adopted (alloy-signer 2.5.0 still requires ^0.13).
    "RUSTSEC-2026-0387",
    # https://rustsec.org/advisories/RUSTSEC-2026-0367 SUID/SGID preservation,
    # https://rustsec.org/advisories/RUSTSEC-2026-0368 symlink extraction, and
    # https://rustsec.org/advisories/RUSTSEC-2026-0369 symlink permissions in zip.
    # After bumping svm-rs to 0.5.32 (now on zip 9), the only remaining user of the
    # vulnerable zip 4 is soldeer-core 0.10.1, which extracts via zip-extract
    # (RUSTSEC-2025-0172). zip-extract applies the archived unix mode, including
    # SUID/SGID, through its own set_unix_mode, so bumping zip alone does not fix
    # this path — the real fix is soldeer-core 0.12.1 (drops zip-extract).
    # Exploitable only when `forge soldeer install` runs as root (e.g. a CI/Docker
    # build) on an untrusted package.
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
    # https://rustsec.org/advisories/RUSTSEC-2026-0391 zstd abandoned-stream leak,
    # https://rustsec.org/advisories/RUSTSEC-2026-0398 and
    # https://rustsec.org/advisories/RUSTSEC-2026-0403 zstd-safe out-of-bounds
    # decompression. compression-codecs / async-compression were bumped to the zstd
    # 0.14 / zstd-safe 8 line; the vulnerable zstd 0.13 / zstd-safe 7 remain only
    # under reth v2.2.0 (nippy-jar, cli-commands, zstd-compressors) and
    # foundry-fork-db, which a reth bump would NOT fix (foundry-fork-db 0.27.0 and
    # reth-zstd-compressors 0.8.2 still require ^0.13). We keep these ignored on
    # reachability grounds: 0391's with_context is not called by the remaining
    # users; 0398's Seekable module is not compiled (the seekable feature is off);
    # and 0403 only affects raw decompress_stream, whose sole caller
    # (compression-codecs) now uses the fixed 0.14 line, while the remaining users
    # go through bulk / stream::read::Decoder / decode_all, which the advisory
    # states are unaffected.
    "RUSTSEC-2026-0391",
    "RUSTSEC-2026-0398",
    "RUSTSEC-2026-0403",
]

# This section is considered when running `cargo deny check bans`.
# More documentation about the 'bans' section can be found here:
# https://embarkstudios.github.io/cargo-deny/checks/bans/cfg.html
[bans]
# Lint level for when multiple versions of the same crate are detected
multiple-versions = "allow"
# Lint level for when a crate version requirement is `*`
wildcards = "allow"
highlight = "all"
# List of crates to deny
deny = [{ name = "openssl" }]
# Certain crates/versions that will be skipped when doing duplicate detection.
skip = []
# Similarly to `skip` allows you to skip certain crates during duplicate
# detection. Unlike skip, it also includes the entire tree of transitive
# dependencies starting at the specified crate, up to a certain depth, which is
# by default infinite
skip-tree = []

[licenses]
version = 2
confidence-threshold = 0.8

# List of explicitly allowed licenses
# See https://spdx.org/licenses/ for list of possible licenses
# [possible values: any SPDX 3.7 short identifier (+ optional exception)].
allow = [
    "0BSD",
    "Apache-2.0 WITH LLVM-exception",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDDL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "OpenSSL",
    "Unicode-3.0",
    "Unlicense",
    "WTFPL",
    "Zlib",
]

# Allow 1 or more licenses on a per-crate basis, so that particular licenses
# aren't accepted for every possible crate as with the normal allow list
exceptions = [
    # CC0 is a permissive license but somewhat unclear status for source code
    # so we prefer to not have dependencies using it
    # https://tldrlegal.com/license/creative-commons-cc0-1.0-universal
    { allow = ["CC0-1.0"], name = "trezor-client" },
    { allow = ["CC0-1.0"], name = "notify" },
    { allow = ["CC0-1.0"], name = "dunce" },
    { allow = ["CC0-1.0"], name = "aurora-engine-modexp" },
    # Rendered mdBook HTML source code includes attribution as required by CC-BY-4.0
    { allow = ["CC-BY-4.0", "MIT"], name = "font-awesome-as-a-crate" },
]
# copyleft = "deny"

# See note in unicode-ident's readme!
[[licenses.clarify]]
name = "unicode-ident"
version = "*"
expression = "(MIT OR Apache-2.0) AND Unicode-DFS-2016"
license-files = [{ path = "LICENSE-UNICODE", hash = 0x3fb01745 }]

[[licenses.clarify]]
name = "ring"
version = "*"
expression = "OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

# This section is considered when running `cargo deny check sources`.
# More documentation about the 'sources' section can be found here:
# https://embarkstudios.github.io/cargo-deny/checks/sources/cfg.html
[sources]
# Lint level for what to happen when a crate from a crate registry that is not
# in the allow list is encountered
unknown-registry = "warn"
# Lint level for what to happen when a crate from a git repository that is not
# in the allow list is encountered
unknown-git = "deny"
allow-git = [
    "https://github.com/alloy-rs/alloy",
    "https://github.com/alloy-rs/evm",
    "https://github.com/foundry-rs/foundry-core",
    "https://github.com/paradigmxyz/revm-inspectors",
    "https://github.com/paradigmxyz/solar",
    "https://github.com/bluealloy/revm",
    # Only for tests.
    "https://github.com/rust-cli/rexpect",
    # Tempo
    "https://github.com/tempoxyz/tempo",
    "https://github.com/tempoxyz/mpp-rs",
    # Transitive dependency of Tempo
    "https://github.com/paradigmxyz/reth",
    "https://github.com/paradigmxyz/reth-core",
    # Temporary: upstream OP crates until release is published.
    "https://github.com/ethereum-optimism/optimism",
    # Arc execution-layer crates (arc-execution-config, etc.).
    "https://github.com/circlefin/arc-node",
    # Transitive dependency of reth (discovery protocol).
    "https://github.com/sigp/discv5",
]
